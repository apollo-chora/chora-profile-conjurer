# profile_conjurer — per-sub-agent model + prompt config.
#
# AGENT-DRIVEN tiering (CR mana-is-quota-not-model-selector 2026-06-01): this
# YAML is the single source of truth for each sub-agent's model tier. The crew
# constructs ONE modelgatewayclient per sub-agent from primary_model (routed
# through chora-model-gateway per ADR-177 full mana umbrella). fallback_models
# is the agent-DECLARED fallback chain (advisory until a future gateway cutover,
# same shape as qgen / moderation).
#
# Mana is a token-budget QUOTA system (manaplugin gate), NOT a model selector —
# the old tieredmodelplugin is no longer registered. See
# feedback_mana_is_quota_not_model_selector.
#
# The deployment's only text route is LongCat-2.5-Preview (registry entry
# `longcat-2.5-preview`, api.longcat.ai), so the fallback repeats the primary:
# there is one provider to degrade to, and the gateway de-duplicates an
# identical (vendor, model) pair, so the chain collapses to a single target.
# Give the conjurer a real second model the day the deployment has one.
#
# profile_conjurer is a P1 Single crew (one conjurer sub-agent). The conjurer
# extracts a bounded set of taxonomy-constrained interest tags from a free-text
# bio + infers proficiency from completed course titles. CHEAP tier is the
# correct fit — it is a bounded-label task and this call is latency-relevant to
# the C+ profiler page. The tier is a cost label, and with one text route the
# ladder is degenerate — CHEAP and HIGH resolve to the same model and cost the
# same; a second, cheaper model restores it.
#
# prompt_version selects the composer template version (currently the embedded v1).
agent: profile_conjurer
sub_agents:
  conjurer:
    tier: cheap
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
