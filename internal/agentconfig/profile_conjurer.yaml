# profile_conjurer — per-sub-agent tier + prompt config.
#
# AGENT-DRIVEN tiering (CR mana-is-quota-not-model-selector 2026-06-01): this
# YAML declares the sub-agent's TIER and its prompt template version. The model
# itself is env-only: the crew reads the REQUIRED PROFILE_CONJURER_MODEL env var
# as the chora-model-gateway logical_model_id (ADR-177 full mana umbrella) and
# the optional PROFILE_CONJURER_FALLBACK_MODELS comma list as the agent-DECLARED
# fallback chain forwarded to InvokeRequest.fallback_logical_model_ids. Boot
# fails loud when PROFILE_CONJURER_MODEL is unset, so no literal model name
# lives here or in the code.
#
# Mana is a token-budget QUOTA system (manaplugin gate), NOT a model selector —
# the old tieredmodelplugin is no longer registered. See
# feedback_mana_is_quota_not_model_selector.
#
# profile_conjurer is a P1 Single crew (one conjurer sub-agent). The conjurer
# extracts a bounded set of taxonomy-constrained interest tags from a free-text
# bio + infers proficiency from completed course titles. CHEAP tier is the
# correct fit — it is a bounded-label task and this call is latency-relevant to
# the C+ profiler page.
#
# prompt_version selects the composer template version (currently the embedded v1).
agent: profile_conjurer
sub_agents:
  conjurer:
    tier: cheap
    prompt_version: v1
