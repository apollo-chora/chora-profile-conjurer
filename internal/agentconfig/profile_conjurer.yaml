# profile_conjurer — per-sub-agent model + prompt config.
#
# AGENT-DRIVEN tiering (CR mana-is-quota-not-model-selector 2026-06-01): this
# YAML is the single source of truth for each sub-agent's model tier. The crew
# constructs ONE gemini.NewModel per sub-agent from primary_model routed through
# chora-model-gateway (ADR-177 full mana umbrella). fallback_models is the
# agent-DECLARED fallback chain (advisory until a future gateway cutover, same
# shape as qgen / moderation).
#
# Mana is a token-budget QUOTA system (manaplugin gate), NOT a model selector —
# the old tieredmodelplugin is no longer registered. See
# feedback_mana_is_quota_not_model_selector.
#
# Tiers (locked 2026-06-01, mirroring qgen's convention):
#   HIGH  = gemini-3.1-pro-preview → gemini-2.5-pro    (reasoning / judgement-heavy)
#   CHEAP = gemini-3.5-flash       → gemini-2.5-flash  (classification / labelling)
#
# profile_conjurer is a P1 Single crew (one conjurer sub-agent). The conjurer
# extracts a bounded set of taxonomy-constrained interest tags from a free-text
# bio + infers proficiency from completed course titles. CHEAP tier is the
# correct fit — it is a bounded-label task and this call is latency-relevant to
# the C+ profiler page.
#
# 3.x models are global-endpoint-only; the gateway resolves the endpoint per
# model, so no region env is needed here. prompt_version selects the composer
# template version (currently the embedded v1).
agent: profile_conjurer
sub_agents:
  conjurer:
    tier: cheap
    primary_model: gemini-3.5-flash
    fallback_models: [gemini-2.5-flash]
    prompt_version: v1
